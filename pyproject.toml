[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql2pyspark"
version = "0.1.0"
description = "Transpile SQL SELECT statements into idiomatic PySpark DataFrame API code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["sqlglot>=20.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sql2pyspark*"]
